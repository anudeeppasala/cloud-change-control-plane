[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-change-control-plane"
version = "0.1.0"
description = "Intent-aware policy gate for Terraform infrastructure changes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anudeep Pasala" }]
keywords = [
  "terraform",
  "devsecops",
  "platform-engineering",
  "policy-as-code",
  "cloud-security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
cloud-guardian = "cloud_guardian.cli:main"

[project.urls]
Source = "https://github.com/anudeeppasala/cloud-change-control-plane"
Issues = "https://github.com/anudeeppasala/cloud-change-control-plane/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_guardian = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["cloud_guardian"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["cloud_guardian"]
